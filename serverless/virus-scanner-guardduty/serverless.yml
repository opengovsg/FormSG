service: virus-scanner-guardduty
frameworkVersion: '3'
useDotenv: true
provider:
  name: aws
  region: ap-southeast-1
  stage: ${opt:stage}
  iam:
    role:
      statements:
        # Allow functions to read/write objects in a bucket
        - Effect: Allow
          Action:
            # AllowPostScanTag
            - 's3:GetObjectTagging'
            - 's3:GetObjectVersionTagging'
            - 's3:PutObjectTagging'
            - 's3:PutObjectVersionTagging'
            # AllowMalwareScan
            - 's3:GetObject'
            - 's3:GetObjectVersion'
            - 's3:DeleteObject'
            - 's3:DeleteObjectVersion'
          Resource:
            - 'arn:aws:s3:::${env:GUARDDUTY_QUARANTINE_S3_BUCKET}/*'
        - Effect: Allow
          Action:
            # AllowCheckBucketOwnership
            - 's3:ListBucket'
            # AllowEnableS3EventBridgeEvents
            - 's3:PutBucketNotification'
            - 's3:GetBucketNotification'
          Resource:
            - 'arn:aws:s3:::${env:GUARDDUTY_QUARANTINE_S3_BUCKET}'
        - Effect: Allow
          Action:
            # AllowPutValidationObject
            - 's3:PutObject'
          Resource:
            - 'arn:aws:s3:::${env:GUARDDUTY_QUARANTINE_S3_BUCKET}/malware-protection-resource-validation-object'
        - Effect: Allow
          Action:
            # Both PutObject* required for copy
            - 's3:PutObject'
            - 's3:PutObjectTagging'
            - 's3:PutObjectVersionTagging'
          Resource:
            - 'arn:aws:s3:::${env:GUARDDUTY_CLEAN_S3_BUCKET}/*'
        - Effect: Allow
          Action:
          # AllowGuardDutyToMonitorEventBridgeManagedRule
          - 'events:DescribeRule'
          - 'events:ListTargetsByRule'
          # AllowUpdateTargetAndDeleteManagedRule
          - 'events:DeleteRule'
          - 'events:PutTargets'
          - 'events:RemoveTargets'
          # AllowManagedRuleToSendS3EventsToGuardDuty
          - 'events:PutRule'
          Resource:
            - 'arn:aws:events:ap-southeast-1:*:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*'

  ecr:
    images:
      virus-scanner-guardduty:
        path: ./
        platform: linux/amd64

functions:
  virus-scanner-guardduty:
    image:
      name: virus-scanner-guardduty
    # max timeout per invocation
    timeout: 300
    memorySize: 128 # Usage of the smallest memory size is possible since the lambda function does not load the file content into memory and simply makes API calls to S3.
    # Provision concurrency so at least one instance always hot
    # https://www.serverless.com/framework/docs/providers/aws/guide/serverless.yml/#provisioned-concurrency
    # 1 for staging, 5 for prod
    provisionedConcurrency: ${param:provisionedConcurrency}

plugins:
  # required so that env variables are loaded in functions
  - serverless-dotenv-plugin
