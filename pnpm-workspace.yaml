blockExoticSubdeps: true
minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeIgnoreMissingTime: false
registries:
  default: 'https://registry.npmjs.org/'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # 1 year — packages published before provenance/trusted-publishing were common shouldn't need it retroactively
trustPolicyExclude:
  # Direct DB driver, forced to this exact patch via the mongoose override
  # below for a security fix. 7.8.8 and 7.8.9 are published by the same
  # npm user (vkarpov15, mongoose's long-time lead maintainer); neither
  # has provenance/attestations at all. The flagged "downgrade" is
  # specifically Trusted-Publisher (OIDC) status dropping between the two,
  # consistent with a manual hotfix publish rather than a takeover signal.
  # Investigated 2026-09-12.
  - 'mongoose@7.8.9'
  # AWS SDK v2 (and other v4-range consumers) pin the 4.x line; 4.5.7 is
  # the `legacy` dist-tag, published by the same long-time maintainer
  # (amitgupta) as 4.5.5/4.5.6. None of those 4.x patches have provenance.
  # The flagged "downgrade" is Trusted-Publisher (OIDC) status dropping
  # versus later 5.x releases that GitHub Actions publishes; 4.5.7 itself
  # is a manual legacy hotfix, not a takeover signal. Investigated 2026-09-18.
  - 'fast-xml-parser@4.5.7'
packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
