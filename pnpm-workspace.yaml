allowBuilds:
  bcrypt: true
  canvas: true
  aws-lambda-ric: true
  microtime: true # part of the original onlyBuiltDependencies list
  # dd-trace's native addons for APM/RASP/profiling — real production
  # observability/security features, verified functional (not nags)
  '@datadog/native-appsec': true
  '@datadog/native-iast-taint-tracking': true
  '@datadog/native-metrics': true
  '@datadog/pprof': true
  # postinstall is just a v2-maintenance-mode console warning, no build step
  aws-sdk: false
  # postinstall is a donation-nag console message, wrapped in try/catch
  core-js: false
  # preinstall is only a Node-version compatibility guard, not a build step
  dd-trace: false
  # postinstall is a donation-nag console message, wrapped in try/catch + exit 0
  es5-ext: false
  # postinstall downloads the platform-specific binary; esbuild cannot run without it
  esbuild: true
  # macOS-only native file-watcher; faster local dev, optional elsewhere
  fsevents: true
  # postinstall runs `msw init`, keeping apps/frontend/public/mockServiceWorker.js
  # in sync with the installed msw version — browser-based mocking needs this
  msw: true
  # postinstall only warns on a dependency-version-scheme mismatch, no build step
  protobufjs: false
  # postinstall is a "successfully installed" welcome message (already
  # self-suppressed in CI via the CI env var), no build step
  serverless: false
  # postinstall downloads the platform-specific libvips binary; sharp cannot run without it
  sharp: true
  # optionalDependency of hot-shots (statsd client); hot-shots is designed to
  # fall back gracefully when this native UDS binding isn't available
  unix-dgram: false
  # postinstall downloads/verifies the platform-specific native resolver binary
  unrs-resolver: true
