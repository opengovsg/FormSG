AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Periodic sweep that closes FormSG forms past their scheduled expiry

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name (eg, production, staging, stg-alt)
  SsmEnvSiteName:
    Type: String
    Default: dev
    Description: >-
      Environment name as used in SSM parameter paths. Usually identical to
      Environment, but not always — formsg-infra maps the stg-alt2 stack to the
      site name stg-alt21, so this is passed explicitly rather than derived.
  SweepSchedule:
    Type: String
    Default: rate(10 minutes)
    Description: >-
      How often to sweep for expired forms. This interval is the worst-case lag
      between a form's deadline and its status flipping to closed, so it is the
      knob to turn if that lag needs to shrink.

Globals:
  Function:
    # Generous relative to a sweep that is a handful of HTTP calls, but the
    # batch loop can make up to MAX_SWEEPS_PER_RUN of them after a backlog.
    Timeout: 120
    MemorySize: 256
    Runtime: nodejs22.x

Resources:
  ScheduledClosureFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Closes forms whose admin-set expiry date has passed
      FunctionName: !Sub "form-scheduled-closure-${Environment}"
      CodeUri: ./
      Handler: index.handler
      Architectures:
        - arm64
      Environment:
        Variables:
          # Site name, NOT the CloudFormation Environment. The lambda builds the
          # API hostname from this, and the two differ: the production stack's
          # site name is `prod` (giving form.gov.sg, not production.form.gov.sg)
          # and stg-alt2's is `stg-alt21`.
          SSM_ENV_SITE_NAME: !Ref SsmEnvSiteName
          # Full path passed in rather than derived in the lambda, so the one
          # place the parameter name is written is here.
          SSM_SECRET_PARAMETER_NAME: !Sub "/${SsmEnvSiteName}/CRON_SCHEDULED_CLOSURE_API_SECRET"
      Policies:
        # Read-only, and scoped to this job's single parameter rather than the
        # whole store. The WithSlashPrefix variant is the one that takes a name
        # already starting with `/`, which pulumi-managed parameters do.
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Sub "/${SsmEnvSiteName}/CRON_SCHEDULED_CLOSURE_API_SECRET"
      Events:
        # SAM expands this into an EventBridge rule plus the permission for it
        # to invoke the function — the schedule is code, not console clicks.
        Sweep:
          Type: Schedule
          Properties:
            Name: !Sub "form-scheduled-closure-sweep-${Environment}"
            Description: Triggers the expired-form sweep
            Schedule: !Ref SweepSchedule

Outputs:
  ScheduledClosureFunctionArn:
    Description: ARN of the scheduled closure Lambda
    Value: !GetAtt ScheduledClosureFunction.Arn
