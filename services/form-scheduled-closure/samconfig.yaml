version: 0.1

# Each `s3_bucket` must exist before that environment's first deploy. They are
# provisioned by pulumi in formsg-infra (`src/scheduledClosure.ts`), which also
# creates the `/<ssm-env-site-name>/CRON_SCHEDULED_CLOSURE_API_SECRET` parameter.
#
# Pulumi suffixes bucket names randomly and regenerates the suffix on apply, so
# take the name from the `scheduledClosureCodeZipBucket` output of an `up`,
# never of a `preview`.

stg:
  deploy:
    parameters:
      stack_name: form-scheduled-closure-stg
      s3_bucket: form-scheduled-closure-code-zip-stg-ab1a512 # Created by pulumi in formsg-infra to store AWS SAM builds.
      region: ap-southeast-1
      capabilities: CAPABILITY_IAM
      s3_prefix: stg
      image_repositories: []
      disable_rollback: false
      confirm_changeset: true
      parameter_overrides: Environment=stg SsmEnvSiteName=stg

stg-alt:
  deploy:
    parameters:
      stack_name: form-scheduled-closure-stg-alt
