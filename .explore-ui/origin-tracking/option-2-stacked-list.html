<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Form Flow — Origin Tracking (Option 2: Stacked List)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

    .option-card {
      padding: 16px;
      border: 1px solid #E1E2E4;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
    }

    .option-card:hover {
      background: #FAFBFF;
    }

    .option-card.selected {
      border: 2px solid #4A61C0;
      background: #F0F2FB;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border: 2px solid #4A61C0;
      border-radius: 4px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 150ms ease;
    }

    .checkbox.checked {
      background: #4A61C0;
    }

    .checkbox svg {
      display: none;
    }

    .checkbox.checked svg {
      display: block;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      color: #293044;
      font-weight: 400;
    }

    .others-input-wrapper {
      max-height: 0;
      overflow: hidden;
      transition: max-height 150ms ease;
    }

    .others-input-wrapper.visible {
      max-height: 80px;
    }

    .others-input {
      width: 100%;
      height: 44px;
      border: 1px solid #C9CCCF;
      border-radius: 4px;
      padding: 0 16px;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      color: #293044;
      margin-top: 8px;
      outline: none;
    }

    .others-input:focus {
      border-color: #4A61C0;
      box-shadow: 0 0 0 2px rgba(74, 97, 192, 0.15);
    }

    .next-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .next-btn.disabled {
      background: #B7C0E6;
      color: #ffffff;
      cursor: default;
      pointer-events: none;
    }

    .next-btn.enabled {
      background: #4A61C0;
      color: #ffffff;
      cursor: pointer;
    }

    .next-btn.enabled:hover {
      background: #3a50a8;
    }

    .progress-bar-fill {
      height: 4px;
      background: #4A61C0;
      width: 40%;
    }

    .progress-bar-track {
      height: 4px;
      background: #E1E2E4;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .form-mockup-bar {
      border-radius: 4px;
      background: #E1E2E4;
    }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden" style="height: 100vh;">

  <!-- Progress bar -->
  <div class="progress-bar-track">
    <div class="progress-bar-fill"></div>
  </div>

  <!-- Split screen -->
  <div style="display: flex; height: 100vh; padding-top: 4px;">

    <!-- Left panel -->
    <div style="width: 50%; background: #ffffff; overflow-y: auto; display: flex; justify-content: center; padding: 3rem 2rem;">
      <div style="max-width: 32rem; width: 100%;">

        <h1 style="font-size: 24px; font-weight: 600; color: #293044; margin: 0 0 8px 0; line-height: 1.3;">
          What was this form before?
        </h1>
        <p style="font-size: 16px; font-weight: 400; color: #9B9FA7; margin: 0 0 24px 0;">
          Select all that apply.
        </p>

        <!-- Options list -->
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px;">

          <!-- Option: Paper form -->
          <div class="option-card" data-value="paper" onclick="toggleOption(this)">
            <div class="checkbox">
              <svg width="14" height="11" viewBox="0 0 14 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 5.5L5.5 9.5L12.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="option-label">
              <span style="font-size: 20px;">📄</span>
              <span>Paper form</span>
            </div>
          </div>

          <!-- Option: PDF document -->
          <div class="option-card" data-value="pdf" onclick="toggleOption(this)">
            <div class="checkbox">
              <svg width="14" height="11" viewBox="0 0 14 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 5.5L5.5 9.5L12.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="option-label">
              <span style="font-size: 20px;">📋</span>
              <span>PDF document</span>
            </div>
          </div>

          <!-- Option: Email -->
          <div class="option-card" data-value="email" onclick="toggleOption(this)">
            <div class="checkbox">
              <svg width="14" height="11" viewBox="0 0 14 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 5.5L5.5 9.5L12.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="option-label">
              <span style="font-size: 20px;">✉️</span>
              <span>Email</span>
            </div>
          </div>

          <!-- Option: Word document -->
          <div class="option-card" data-value="word" onclick="toggleOption(this)">
            <div class="checkbox">
              <svg width="14" height="11" viewBox="0 0 14 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 5.5L5.5 9.5L12.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="option-label">
              <span style="font-size: 20px;">📝</span>
              <span>Word document</span>
            </div>
          </div>

          <!-- Option: New form (mutually exclusive) -->
          <div class="option-card" data-value="new" data-exclusive="true" onclick="toggleOption(this)">
            <div class="checkbox">
              <svg width="14" height="11" viewBox="0 0 14 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 5.5L5.5 9.5L12.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="option-label">
              <span style="font-size: 20px;">✨</span>
              <span>This is a new form</span>
            </div>
          </div>

          <!-- Option: Others -->
          <div>
            <div class="option-card" data-value="others" onclick="toggleOption(this)">
              <div class="checkbox">
                <svg width="14" height="11" viewBox="0 0 14 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1.5 5.5L5.5 9.5L12.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <div class="option-label">
                <span style="font-size: 20px;">⋯</span>
                <span>Others</span>
              </div>
            </div>
            <div class="others-input-wrapper" id="othersInputWrapper">
              <input
                class="others-input"
                id="othersInput"
                type="text"
                placeholder="Please specify"
              />
            </div>
          </div>

        </div>

        <!-- Next step button -->
        <button class="next-btn disabled" id="nextBtn">
          Next step →
        </button>

      </div>
    </div>

    <!-- Right panel -->
    <div style="width: 50%; background: #E8EAFA; display: flex; align-items: center; justify-content: center;">
      <!-- Form mockup card -->
      <div style="width: 320px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 24px rgba(41, 48, 68, 0.12); overflow: hidden;">
        <!-- Blue header -->
        <div style="background: #4A61C0; height: 48px; display: flex; align-items: center; justify-content: center;">
          <span style="color: #ffffff; font-size: 14px; font-weight: 600;">Your form name</span>
        </div>
        <!-- Placeholder content -->
        <div style="padding: 24px 20px; display: flex; flex-direction: column; gap: 16px;">
          <div class="form-mockup-bar" style="height: 12px; width: 80%;"></div>
          <div class="form-mockup-bar" style="height: 12px; width: 60%;"></div>
          <div class="form-mockup-bar" style="height: 12px; width: 72%;"></div>
          <div style="margin-top: 8px;">
            <div style="height: 36px; background: #E1E2E4; border-radius: 4px; width: 100%;"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const selected = new Set();

    function toggleOption(card) {
      const value = card.dataset.value;
      const isExclusive = card.dataset.exclusive === 'true';
      const checkbox = card.querySelector('.checkbox');

      if (selected.has(value)) {
        // Deselect
        selected.delete(value);
        card.classList.remove('selected');
        checkbox.classList.remove('checked');

        if (value === 'others') {
          hideOthersInput();
        }
      } else {
        // Select
        if (isExclusive) {
          // Deselect everything else
          clearAll();
        } else {
          // Deselect "new form" if it was selected
          deselectExclusive();
        }

        selected.add(value);
        card.classList.add('selected');
        checkbox.classList.add('checked');

        if (value === 'others') {
          showOthersInput();
        }
      }

      updateButton();
    }

    function clearAll() {
      const cards = document.querySelectorAll('.option-card');
      cards.forEach(c => {
        c.classList.remove('selected');
        c.querySelector('.checkbox').classList.remove('checked');
      });
      selected.clear();
      hideOthersInput();
    }

    function deselectExclusive() {
      const exclusiveCard = document.querySelector('[data-exclusive="true"]');
      if (exclusiveCard && selected.has(exclusiveCard.dataset.value)) {
        selected.delete(exclusiveCard.dataset.value);
        exclusiveCard.classList.remove('selected');
        exclusiveCard.querySelector('.checkbox').classList.remove('checked');
      }
    }

    function showOthersInput() {
      document.getElementById('othersInputWrapper').classList.add('visible');
      setTimeout(() => document.getElementById('othersInput').focus(), 160);
    }

    function hideOthersInput() {
      document.getElementById('othersInputWrapper').classList.remove('visible');
      document.getElementById('othersInput').value = '';
    }

    function updateButton() {
      const btn = document.getElementById('nextBtn');
      if (selected.size > 0) {
        btn.classList.remove('disabled');
        btn.classList.add('enabled');
      } else {
        btn.classList.remove('enabled');
        btn.classList.add('disabled');
      }
    }
  </script>

</body>
</html>
