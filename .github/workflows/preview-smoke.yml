name: Preview smoke

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  merge_group:

permissions:
  contents: read

jobs:
  author:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      member: ${{ steps.check.outputs.member }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: .github/actions
      - id: check
        uses: ./.github/actions/formsg-team-member
        with:
          user: ${{ github.event.pull_request.user.login }}

  smoke:
    name: Synthetics smoke on preview
    needs: author
    concurrency:
      group: preview-smoke-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    if: >-
      github.event.pull_request.state == 'open' &&
      (
        (
          needs.author.outputs.member == 'true' &&
          !github.event.pull_request.draft &&
          (
            contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review"]'), github.event.action) ||
            (github.event.action == 'labeled' && github.event.label.name == 'preview-smoke')
          )
        ) ||
        (
          contains(github.event.pull_request.labels.*.name, 'render-preview') &&
          contains(github.event.pull_request.labels.*.name, 'preview-smoke') &&
          (
            contains(fromJSON('["reopened", "synchronize"]'), github.event.action) ||
            (github.event.action == 'labeled' && contains(fromJSON('["render-preview", "preview-smoke"]'), github.event.label.name))
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - if: github.event.action == 'labeled'
        uses: ./.github/actions/require-write-access
        with:
          user: ${{ github.event.sender.login }}
      - name: Wait for preview deploy of head SHA
        id: await
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/render-preview.sh await "formsg-pr-$PR" "$SHA"
      - uses: ./.github/actions/synthetics-smoke
        with:
          url: ${{ steps.await.outputs.url }}
          dd-api-key: ${{ secrets.DD_API_KEY }}
          dd-app-key: ${{ secrets.DD_APP_KEY }}
