name: Render preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  author:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      member: ${{ steps.check.outputs.member }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: .github/actions
      - id: check
        uses: ./.github/actions/formsg-team-member
        with:
          user: ${{ github.event.pull_request.user.login }}

  up:
    needs: author
    concurrency:
      group: render-preview-${{ github.event.pull_request.number }}
    if: >-
      github.event.pull_request.state == 'open' &&
      (
        (
          needs.author.outputs.member == 'true' &&
          !github.event.pull_request.draft &&
          contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review"]'), github.event.action)
        ) ||
        (
          contains(github.event.pull_request.labels.*.name, 'render-preview') &&
          (
            contains(fromJSON('["reopened", "synchronize"]'), github.event.action) ||
            (github.event.action == 'labeled' && github.event.label.name == 'render-preview')
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - if: github.event.action == 'labeled'
        uses: ./.github/actions/require-write-access
        with:
          user: ${{ github.event.sender.login }}
      - id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_GROWTHBOOK_CLIENT_KEY: ${{ secrets.RENDER_GROWTHBOOK_CLIENT_KEY }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/render-preview.sh up "formsg-pr-$PR" "$BRANCH" "$SHA"
      - if: steps.render.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.render.outputs.url }}
          DASHBOARD: ${{ steps.render.outputs.dashboard }}
          MEMBER: ${{ needs.author.outputs.member }}
        run: |
          if [ "$MEMBER" = true ]; then removal="the PR closes"; else removal="the \`render-preview\` label is removed or the PR closes"; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Render preview is building: $URL ([logs]($DASHBOARD)). It uses staging's database and config, redeploys on every push, and is deleted when $removal."

  down:
    needs: author
    concurrency:
      group: render-preview-${{ github.event.pull_request.number }}
    if: >-
      github.event.action == 'closed' ||
      (
        github.event.action == 'unlabeled' &&
        github.event.label.name == 'render-preview' &&
        needs.author.outputs.member != 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/render-preview.sh down "formsg-pr-$PR"
