name: CI

env:
  NODE_VERSION: '22.22'
  PNPM_VERSION: '10.30.3'

on:
  push:
    branches-ignore:
      - stg
      - stg-alt
      - stg-alt2
      - stg-alt3
      - uat
  pull_request:
    types: [opened, reopened]
    branches-ignore:
      - stg
      - stg-alt
      - stg-alt2
      - stg-alt3
      - uat

jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            frontend:
              - __tests__/**
              - apps/frontend/**
              - pnpm-lock.yaml
            backend:
              - apps/backend/src/**
              - apps/backend/__tests__/**
              - apps/backend/package.json
              - pnpm-lock.yaml
            shared:
              - packages/shared/constants/**
              - packages/shared/modules/**
              - packages/shared/types/**
              - packages/shared/utils/**
              - packages/shared/package.json
              - pnpm-lock.yaml
            sdk:
              - packages/sdk/src/**
              - packages/sdk/spec/**
              - packages/sdk/package.json
              - packages/sdk/tsconfig*.json
              - packages/sdk/jest.config.js
              - pnpm-lock.yaml

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          AWS_SDK_JS_SUPPRESS_MAINTENANCE_MODE_MESSAGE: 1
      - name: Upload build files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            package*.json
            dist/
      - name: Cache build artifacts
        uses: actions/cache/save@v3
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
            packages/shared/node_modules
            packages/sdk/node_modules
            apps/frontend/dist
            apps/backend/dist
            packages/shared/dist
            packages/sdk/dist
            services/virus-scanner/build
            services/virus-scanner-guardduty/build
          key: ${{ runner.os }}-build-${{ github.sha }}

  frontend_test:
    needs: [changes, install, build]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Restore build artifacts
        uses: actions/cache/restore@v3
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
            packages/shared/node_modules
            packages/sdk/node_modules
            apps/frontend/dist
            apps/backend/dist
            packages/shared/dist
            packages/sdk/dist
            services/virus-scanner/build
            services/virus-scanner-guardduty/build
          key: ${{ runner.os }}-build-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Install dependencies
        run: pnpm install
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@7f2b515b64333229315f4701adc590ee6586b270 # v1.0.5
        with:
          languages: js
          service-name: ${{ secrets.DD_SERVICE }}
          api-key: ${{ secrets.DD_API_KEY }}
      - name: Run frontend test
        env:
          DD_TAGS: layer:frontend
          NODE_OPTIONS: --max-old-space-size=4096 -r ${{ env.DD_TRACE_PACKAGE }}
          AWS_SDK_JS_SUPPRESS_MAINTENANCE_MODE_MESSAGE: 1
        run: pnpm test:frontend

  frontend_lint:
    needs: [changes, install]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - run: pnpm lint:frontend

  backend_test:
    needs: [changes, install, build]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Restore build artifacts
        uses: actions/cache/restore@v3
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
            packages/shared/node_modules
            packages/sdk/node_modules
            apps/frontend/dist
            apps/backend/dist
            packages/shared/dist
            packages/sdk/dist
            services/virus-scanner/build
            services/virus-scanner-guardduty/build
          key: ${{ runner.os }}-build-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Install dependencies
        run: pnpm install
      - run: pnpm install --prefix services/pdf-gen-sparticuz
      - run: pnpm install --prefix services/virus-scanner-guardduty
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@7f2b515b64333229315f4701adc590ee6586b270 # v1.0.5
        with:
          languages: js
          service-name: ${{ secrets.DD_SERVICE }}
          api-key: ${{ secrets.DD_API_KEY }}
      - run: pnpm test:backend:ci
        env:
          DD_TAGS: layer:backend
          NODE_OPTIONS: --max-old-space-size=4096 -r ${{ env.DD_TRACE_PACKAGE }}
          AWS_SDK_JS_SUPPRESS_MAINTENANCE_MODE_MESSAGE: 1

  backend_lint:
    needs: [changes, install]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - run: pnpm lint-ci:backend

  shared_lint:
    needs: [changes, install]
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - run: pnpm lint-ci:shared
  
  shared_test:
    needs: [changes, install]
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@7f2b515b64333229315f4701adc590ee6586b270 # v1.0.5
        with:
          languages: js
          service-name: ${{ secrets.DD_SERVICE }}
          api-key: ${{ secrets.DD_API_KEY }}
      - run: pnpm test:shared
        env:
          DD_TAGS: layer:shared
          NODE_OPTIONS: --max-old-space-size=4096 -r ${{ env.DD_TRACE_PACKAGE }}

  sdk_test:
    # Mirrors the old formsg-javascript-sdk ci.yml `test` job — jest against
    # packages/sdk/spec/**, no build step required (ts-jest compiles at test
    # time). Gated on changes in packages/sdk so unrelated PRs are unaffected.
    needs: [changes, install]
    if: ${{ needs.changes.outputs.sdk == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@7f2b515b64333229315f4701adc590ee6586b270 # v1.0.5
        with:
          languages: js
          service-name: ${{ secrets.DD_SERVICE }}
          api-key: ${{ secrets.DD_API_KEY }}
      - run: pnpm test:sdk
        env:
          DD_TAGS: layer:sdk
          NODE_OPTIONS: --max-old-space-size=4096 -r ${{ env.DD_TRACE_PACKAGE }}
