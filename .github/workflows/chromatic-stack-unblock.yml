# Re-runs Chromatic for stacked PRs that chromatic-gate.sh held back, once the
# PR below them passes UI Tests (changes accepted, or nothing changed).
# `status` events only run this file from the default branch.
name: 'Chromatic stack unblock'

on: status

jobs:
  unblock:
    if: "${{ github.event.context == 'UI Tests: formsg-app' && github.event.state == 'success' }}"
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
      statuses: read
    steps:
      - name: Dispatch Chromatic for gated child PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Branches whose head is the commit that just passed.
          BRANCHES: ${{ toJSON(github.event.branches) }}
        run: |
          jq -r '.[].name' <<<"$BRANCHES" | while read -r base; do
            gh pr list --repo "$REPO" --base "$base" --state open \
              --json headRefName,headRefOid,isDraft \
              --jq '.[] | select(.isDraft | not) | "\(.headRefName) \(.headRefOid)"' |
              while read -r head sha; do
                gate=$(gh api "repos/$REPO/commits/$sha/status" \
                  --jq '.statuses[] | select(.context == "Chromatic stack gate") | .state')
                if [ "$gate" = pending ]; then
                  echo "Dispatching Chromatic for $head"
                  # Fails if the branch predates workflow_dispatch in chromatic.yml;
                  # it gets built on its next push instead.
                  gh workflow run chromatic.yml --repo "$REPO" --ref "$head" ||
                    echo "::warning::Could not dispatch Chromatic for $head"
                fi
              done
          done
