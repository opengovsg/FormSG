# Re-runs Chromatic for stacked PRs that `chromatic-stack.sh gate` held back,
# once the PR below them passes UI Tests (changes accepted, or nothing changed).
# `status` events only run this file from the default branch, so the script it
# executes is trusted code, never a PR's.
name: 'Chromatic stack unblock'

on: status

jobs:
  unblock:
    if: "${{ github.event.context == 'UI Tests: formsg-app' && github.event.state == 'success' }}"
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Dispatch Chromatic for held child PRs
        run: .github/scripts/chromatic-stack.sh unblock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Branches whose head is the commit that just passed.
          BRANCHES: ${{ toJSON(github.event.branches) }}
