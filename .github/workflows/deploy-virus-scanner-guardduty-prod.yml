name: Deploy Virus Scanner GuardDuty to production

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version tag to deploy (e.g. v7.4.5)'
        required: true
        type: string

jobs:
  deploy-scanner-guardduty:
    name: Deploy Scanner Guardduty
    uses: ./.github/workflows/aws-deploy-scanner-guardduty-iac.yml
    with:
      checkoutBranch: ${{ inputs.version }}
      gha-environment: 'production'
      environment: 'production'
      provisionedConcurrency: 10
    secrets:
      cicd-role: ${{ secrets.IAC_AWS_CI_ROLE_TO_ASSUME }}
