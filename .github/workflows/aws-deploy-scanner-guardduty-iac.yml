name: AWS Deploy Virus Scanner GuardDuty to new OGP AWS environment 

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: string
      provisionedConcurrency:
        description: 'Provisioned concurrency'
        required: true
        type: number
      checkoutBranch:
        description: 'Branch to checkout code from'
        required: true
        type: string
      aws-region: 
        description: 'AWS region to use'
        required: false
        default: 'ap-southeast-1'
        type: string
    secrets:
      cicd-role:
        description: 'AWS IAM role to assume by GitHub action runner'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  virus-scanner:
    name: virus scanner guardduty serverless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch source code into runner environment
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-scanner-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-scanner-
            ${{ runner.OS }}-node-
      - name: Grant runner AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.cicd-role }}
          aws-region: ${{ inputs.aws-region }}
      - name: Install node dependencies
        working-directory: ./serverless/virus-scanner-guardduty
        run: npm ci
      - name: Deploy with Serverless Framework
        working-directory: ./serverless/virus-scanner-guardduty
        env:
          ENV: ${{ inputs.environment }}
          CONCURRENCY: ${{ inputs.provisionedConcurrency }}
        run: npm run deploy
