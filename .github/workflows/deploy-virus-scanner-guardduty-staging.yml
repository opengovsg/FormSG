name: Deploy Virus Scanner GuardDuty to new OGP AWS environment

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - staging-alt3

jobs:
  deploy-scanner-guardduty:
    name: Deploy Scanner Guardduty
    uses: ./.github/workflows/aws-deploy-scanner-guardduty-iac.yml
    with:
      checkoutBranch: staging-alt3
      environment: stg-alt3
      provisionedConcurrency: 1
    secrets: 
      cicd-role: ${{ secrets.STG_ALT3_AWS_CI_ROLE_TO_ASSUME }}
    secrets: inherit
