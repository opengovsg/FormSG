name: Nightly load test

on:
  schedule:
    - cron: '0 18 * * 0-4'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run'
        required: true
        default: 'view-form'
        type: choice
        options:
          - view-form
          - submit-storage
          - smoke
      variant:
        description: 'load gates; stress and spike report only'
        required: true
        default: 'load'
        type: choice
        options:
          - load
          - stress
          - spike
      fixture:
        description: 'Seeded form to target'
        required: true
        default: 'typical'
        type: choice
        options:
          - typical
          - large
      rate:
        description: 'Per second: page loads for view-form, submissions for submit-storage. Empty uses the scenario default.'
        required: false
        default: ''
        type: string
      p95_ms:
        description: 'Latency gate in ms. 0 turns it off.'
        required: true
        default: '5000'
        type: string

concurrency:
  group: load-test-nightly
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: '652261905145'
  CICD_ROLE: arn:aws:iam::652261905145:role/formsg-uat-load-test-github-oidc-role
  ECR_REPOSITORY: formsg-uat-load-tests
  ECS_CLUSTER: formsg-uat-ecs
  ECS_SERVICE: formsg-uat-ecs-service
  TARGET_URL: https://uat.form.gov.sg
  VARIANT: ${{ inputs.variant || 'load' }}
  FIXTURE: ${{ inputs.fixture || 'typical' }}
  P95_MS: ${{ inputs.p95_ms || '5000' }}
  NODE_VERSION: '22.23'
  PNPM_VERSION: '10.30.3'

jobs:
  load-test:
    name: Load test UAT (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.scenario && format('[{{"scenario":"{0}","rate":"{1}"}}]', inputs.scenario, inputs.rate) || '[{"scenario":"view-form","rate":""},{"scenario":"submit-storage","rate":""}]') }}
    env:
      SCENARIO: ${{ matrix.scenario }}
      RATE: ${{ matrix.rate }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check the workflow is configured
        env:
          SUBNETS: ${{ vars.LOAD_TEST_SUBNET_IDS }}
          SECURITY_GROUP: ${{ vars.LOAD_TEST_SECURITY_GROUP_ID }}
        run: |
          missing=()
          [ -n "$SUBNETS" ] || missing+=("LOAD_TEST_SUBNET_IDS")
          [ -n "$SECURITY_GROUP" ] || missing+=("LOAD_TEST_SECURITY_GROUP_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Unset repository variables: ${missing[*]}. Read them from the formsg-infra uat stack outputs."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.CICD_ROLE }}
          role-session-name: github-action-load-test
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push the k6 image
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ghactions-${{ github.sha }}
        run: |
          pnpm install --frozen-lockfile --filter formsg-load-tests
          pnpm --filter formsg-load-tests build
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" load-tests
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Seed the fixtures
        run: |
          service=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --output json)
          primary=$(echo "$service" | jq -c '.services[0]
            | ((.taskSets // []) | map(select(.status == "PRIMARY"))[0])
              // {taskDefinition: .taskDefinition, networkConfiguration: .networkConfiguration}')
          TASK_DEFINITION=$(echo "$primary" | jq -r '.taskDefinition // empty')
          SUBNETS=$(echo "$primary" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets // [] | join(",")')
          SECURITY_GROUP=$(echo "$primary" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups // [] | join(",")')
          if [ -z "$TASK_DEFINITION" ] || [ -z "$SUBNETS" ] || [ -z "$SECURITY_GROUP" ]; then
            echo "::error::Could not read the primary task set of $ECS_SERVICE: $primary"
            exit 1
          fi

          site=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" --output json \
            | jq -r '.taskDefinition.containerDefinitions[] | select(.name == "formsg-app")
                | .secrets[] | select(.name == "SSM_ENV_SITE_NAME") | .valueFrom')
          if [ "$site" != "/uat/SSM_ENV_SITE_NAME" ]; then
            echo "::error::$TASK_DEFINITION reads SSM_ENV_SITE_NAME from '$site', not /uat/. Refusing to seed."
            exit 1
          fi
          export SUBNETS SECURITY_GROUP

          ./.github/scripts/run-load-test-task.sh \
            --task-definition "$TASK_DEFINITION" \
            --container formsg-app \
            --command 'pnpm,--filter,formsg-backend,start:seed-load-test'

      - name: Run k6
        env:
          SUBNETS: ${{ vars.LOAD_TEST_SUBNET_IDS }}
          SECURITY_GROUP: ${{ vars.LOAD_TEST_SECURITY_GROUP_ID }}
          IMAGE: ${{ steps.push-image.outputs.image }}
        run: |
          ARGS="run,/scripts/scenarios/${SCENARIO}.js"
          ARGS="$ARGS,--out,opentelemetry"
          ARGS="$ARGS,--env,TARGET_URL=${TARGET_URL}"
          ARGS="$ARGS,--env,VARIANT=${VARIANT}"
          ARGS="$ARGS,--env,FIXTURE=${FIXTURE}"
          if [ -n "$RATE" ]; then
            ARGS="$ARGS,--env,RATE=${RATE}"
          fi
          ARGS="$ARGS,--env,P95_MS=${P95_MS}"

          aws ecs register-task-definition \
            --cli-input-json "$(sed -e "s|<AWS_ACCOUNT_ID>|${AWS_ACCOUNT_ID}|g" load-tests/ecs-task-definition.json \
              | jq --arg image "$IMAGE" '(.containerDefinitions[] | select(.name == "k6")).image = $image')" \
            --query 'taskDefinition.taskDefinitionArn' --output text > "$RUNNER_TEMP/task-def-arn"

          ./.github/scripts/run-load-test-task.sh \
            --task-definition "$(cat "$RUNNER_TEMP/task-def-arn")" \
            --container k6 \
            --command "$ARGS"
