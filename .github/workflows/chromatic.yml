# .github/workflows/chromatic.yml

# Workflow name
name: 'Chromatic'

# Event for the workflow
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize]

# List of jobs
jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      emailpreview: ${{ steps.filter.outputs.emailpreview }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            frontend:
              - packages/shared/**
              - apps/frontend/**
            emailpreview:
              - packages/react-email-preview/**

  chromatic-deployment-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    # Operating System
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    # Job steps
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build SDK
        working-directory: .
        run: pnpm build:sdk
      - name: Publish to Chromatic
        uses: chromaui/action@c93e0bc3a63aa176e14a75b61a31847cbfdd341c # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/frontend
          autoAcceptChanges: develop
          exitOnceUploaded: true
          onlyChanged: true
          storybookBaseDir: apps/frontend
          # Skip running Chromatic on dependabot PRs
          skip: dependabot/**
          # TurboSnap's untraced globs. Repo-root-relative on purpose: the CLI
          # resolves configFile from the action's cwd, not from workingDir.
          configFile: apps/frontend/chromatic.config.json

  chromatic-deployment-emailpreview:
    needs: changes
    if: ${{ needs.changes.outputs.emailpreview == 'true' }}
    # Operating System
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-email-preview
    # Job steps
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build SDK
        working-directory: .
        run: pnpm build:sdk
      - name: Publish to Chromatic
        uses: chromaui/action@c93e0bc3a63aa176e14a75b61a31847cbfdd341c # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_EMAIL_PROJECT_TOKEN }}
          workingDir: packages/react-email-preview
          autoAcceptChanges: develop
          exitOnceUploaded: true
          onlyChanged: true
          storybookBaseDir: packages/react-email-preview
          # Skip running Chromatic on dependabot PRs
          skip: dependabot/**
