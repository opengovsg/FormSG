# .github/workflows/chromatic.yml

# Workflow name
name: 'Chromatic'

env:
  NODE_VERSION: '22.22'
  PNPM_VERSION: '10.30.3'

# Event for the workflow
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize]

# List of jobs
jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      emailpreview: ${{ steps.filter.outputs.emailpreview }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            frontend:
              - packages/shared/**
              - apps/frontend/**
            emailpreview:
              - packages/react-email-preview/**

  chromatic-deployment-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    # Operating System
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    # Job steps
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build SDK
        working-directory: .
        run: pnpm build:sdk
        # 👇 Adds Chromatic as a step in the workflow
      - name: Publish to Chromatic
        uses: chromaui/action@c93e0bc3a63aa176e14a75b61a31847cbfdd341c # v1
        # Chromatic GitHub Action options
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 👇 Chromatic projectToken, refer to the manage page to obtain it.
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/frontend
          autoAcceptChanges: develop
          exitOnceUploaded: true
          onlyChanged: true
          storybookBaseDir: apps/frontend
          # Skip running Chromatic on dependabot PRs
          skip: dependabot/**
          # Only run when the frontend directory has changes
          untraced: '!(apps/frontend)/**'

  chromatic-deployment-emailpreview:
    needs: changes
    if: ${{ needs.changes.outputs.emailpreview == 'true' }}
    # Operating System
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-email-preview
    # Job steps
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        working-directory: .
        run: pnpm install
      - name: Build SDK
        working-directory: .
        run: pnpm build:sdk
        # 👇 Adds Chromatic as a step in the workflow
      - name: Publish to Chromatic
        uses: chromaui/action@c93e0bc3a63aa176e14a75b61a31847cbfdd341c # v1
        # Chromatic GitHub Action options
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 👇 Chromatic projectToken, refer to the manage page to obtain it.
          projectToken: ${{ secrets.CHROMATIC_EMAIL_PROJECT_TOKEN }}
          workingDir: packages/react-email-preview
          autoAcceptChanges: develop
          exitOnceUploaded: true
          onlyChanged: true
          storybookBaseDir: packages/react-email-preview
          # Skip running Chromatic on dependabot PRs
          skip: dependabot/**
          # Only run when the react-email-preview directory has changes
          untraced: '!(packages/react-email-preview)/**'
