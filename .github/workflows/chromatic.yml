# .github/workflows/chromatic.yml

# Workflow name
name: 'Chromatic'

env:
  NODE_VERSION: '22.22'
  PNPM_VERSION: '10.30.3'

# Event for the workflow
on:
  push:
    branches:
      - develop
  pull_request:
    # edited: only acts when the base changes, e.g. a stacked PR retargeted
    # to develop after the PR below it merges.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  # Dispatched by chromatic-stack-unblock.yml once a stacked PR's base passes.
  workflow_dispatch:

# Jobs run PR code (pnpm install, Storybook build), so the token is
# read-only by default; jobs that need more declare it themselves.
permissions:
  contents: read

# List of jobs
jobs:
  # JOB to run change detection
  changes:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    # Set job outputs to values from filter step
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      emailpreview: ${{ steps.filter.outputs.emailpreview }}
      eligible: ${{ steps.gate.outputs.eligible }}
      stack_ready: ${{ steps.gate.outputs.stack_ready }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            frontend:
              - packages/shared/**
              - apps/frontend/**
            emailpreview:
              - packages/react-email-preview/**
      - name: Hold stacked PRs whose base awaits Chromatic review
        id: gate
        run: .github/scripts/chromatic-stack.sh gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF_NAME: ${{ github.ref_name }}
          BASE_CHANGED: ${{ github.event.changes.base && 'true' || 'false' }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}

  chromatic-deployment-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' && needs.changes.outputs.eligible == 'true' && needs.changes.outputs.stack_ready == 'true' }}
    # A newer push to the same PR cancels this run; Chromatic only bills once
    # the Storybook is uploaded (~3 min in). develop builds never cancel. Set on
    # the job, not the workflow, so runs whose jobs are skipped can't cancel.
    concurrency:
      group: chromatic-frontend-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name != 'push' }}
    # Operating System
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    # Job steps
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
          # Build the PR head, not GitHub's merge commit with develop: TurboSnap
          # diffs from the checkout, so the merge commit leaks every develop
          # change into the PR's changed files.
          # https://www.chromatic.com/docs/github-actions/#recommended-configuration-for-build-events
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build SDK
        working-directory: .
        run: pnpm build:sdk
        # 👇 Adds Chromatic as a step in the workflow
      - name: Publish to Chromatic
        uses: chromaui/action@c93e0bc3a63aa176e14a75b61a31847cbfdd341c # v1
        # Chromatic GitHub Action options
        with:
          # 👇 Chromatic projectToken, refer to the manage page to obtain it.
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/frontend
          autoAcceptChanges: develop
          exitOnceUploaded: true
          onlyChanged: true
          storybookBaseDir: apps/frontend
          # Skip running Chromatic on dependabot PRs
          skip: dependabot/**
          # TurboSnap's untraced globs. Repo-root-relative on purpose: the CLI
          # resolves configFile from the action's cwd, not from workingDir.
          configFile: apps/frontend/chromatic.config.json

  chromatic-deployment-emailpreview:
    needs: changes
    if: ${{ needs.changes.outputs.emailpreview == 'true' && needs.changes.outputs.eligible == 'true' }}
    concurrency:
      group: chromatic-emailpreview-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name != 'push' }}
    # Operating System
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-email-preview
    # Job steps
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        working-directory: .
        run: pnpm install
      - name: Build SDK
        working-directory: .
        run: pnpm build:sdk
        # 👇 Adds Chromatic as a step in the workflow
      - name: Publish to Chromatic
        uses: chromaui/action@c93e0bc3a63aa176e14a75b61a31847cbfdd341c # v1
        # Chromatic GitHub Action options
        with:
          # 👇 Chromatic projectToken, refer to the manage page to obtain it.
          projectToken: ${{ secrets.CHROMATIC_EMAIL_PROJECT_TOKEN }}
          workingDir: packages/react-email-preview
          autoAcceptChanges: develop
          exitOnceUploaded: true
          onlyChanged: true
          storybookBaseDir: packages/react-email-preview
          # Skip running Chromatic on dependabot PRs
          skip: dependabot/**
