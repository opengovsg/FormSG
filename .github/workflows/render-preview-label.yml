name: Toggle Render preview

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  pull-requests: write

jobs:
  toggle:
    if: github.event.label.name == 'render-preview'
    runs-on: ubuntu-latest
    steps:
      - name: Add or remove [render preview] in the PR title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          ACTION: ${{ github.event.action }}
        run: |
          clean="$(printf '%s' "$TITLE" | sed 's/ *\[render preview\]//g')"
          if [ "$ACTION" = labeled ]; then
            new="$clean [render preview]"
          else
            new="$clean"
          fi
          if [ "$new" != "$TITLE" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --title "$new"
          fi
