name: Synthetics sync

# Pushes the Datadog synthetic test definitions in .github/synthetics/tests/
# to Datadog whenever they change on develop. New definitions are created (or
# adopted by name if they already exist in Datadog), and any resulting
# ids.json changes are committed back to develop so the smoke gate picks the
# new tests up. GITHUB_TOKEN pushes don't trigger workflows, so the
# commit-back can't loop.

on:
  push:
    branches: [develop]
    paths: ['.github/synthetics/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Push test definitions to Datadog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Sync
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: .github/synthetics/sync.sh push
      - name: Commit updated ids.json
        run: |
          if ! git diff --quiet .github/synthetics/ids.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/synthetics/ids.json
            git commit -m 'ci(synthetics): record new Datadog test ids'
            git push
          fi
