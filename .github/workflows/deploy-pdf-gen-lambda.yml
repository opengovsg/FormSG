name: Deploy PDF Generator Lambda 

on:
  workflow_call:
    inputs:
      gha-environment:
        description: 'GitHub Actions environment'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: string
      checkoutBranch:
        description: 'Branch to checkout code from'
        required: true
        type: string
      aws-region:
        description: 'AWS region to use'
        required: false
        default: 'ap-southeast-1'
        type: string
    secrets: 
      cicd-role:
        description: 'AWS IAM role to assume by GitHub action runner'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-pdf-gen-lambda:
    name: Deploy PDF Generator Lambda using SAM
    runs-on: ubuntu-latest
    environment: ${{ inputs.gha-environment }}
    steps:
      - name: Checkout branch source code into runner environment
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ inputs.checkoutBranch }}
          fetch-depth: 0
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Instal pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.cicd-role }}
          aws-region: ${{ inputs.aws-region }}
      - name: Install node dependencies
        working-directory: ./serverless/pdf-gen-sparticuz
        run: pnpm install
      - name: Build SAM package
        working-directory: ./serverless/pdf-gen-sparticuz
        run: pnpm sam-build
      - name: Deploy with SAM
        working-directory: ./serverless/pdf-gen-sparticuz
        run: pnpm run sam-deploy --config-env ${{ inputs.environment }} --no-confirm-changeset --no-fail-on-empty-changeset
