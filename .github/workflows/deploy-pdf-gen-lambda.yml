name: Deploy PDF Generator Lambda 

on:
  workflow_call:
    inputs:
      gha-environment:
        description: 'GitHub Actions environment'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: string
      checkoutBranch:
        description: 'Branch to checkout code from'
        required: true
        type: string
      aws-region:
        description: 'AWS region to use'
        required: false
        default: 'ap-southeast-1'
        type: string
    secrets: 
      cicd-role:
        description: 'AWS IAM role to assume by GitHub action runner'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-pdf-gen-lambda:
    name: Deploy PDF Generator Lambda using SAM
    runs-on: ubuntu-latest
    environment: ${{ inputs.gha-environment }}
    steps:
      - name: Checkout branch source code into runner environment
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkoutBranch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-pdf-gen-${{ hashFiles('./serverless/pdf-gen-sparticuz/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-pdf-gen-
            ${{ runner.OS }}-node-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.cicd-role }}
          aws-region: ${{ inputs.aws-region }}

      - name: Install node dependencies
        working-directory: ./serverless/pdf-gen-sparticuz
        run: npm ci

      - name: Deploy with SAM
        working-directory: ./serverless/pdf-gen-sparticuz
        run: npm run sam-deploy -- --config-env {{ inputs.environment }} --no-confirm-changeset --no-fail-on-empty-changeset
