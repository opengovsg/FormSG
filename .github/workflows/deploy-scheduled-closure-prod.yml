name: Deploy Scheduled Closure Lambda to production

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version tag to deploy (e.g. v7.4.5)'
        required: true
        type: string

jobs:
  deploy-scheduled-closure-lambda:
    name: Deploy Scheduled Closure Lambda
    uses: ./.github/workflows/deploy-scheduled-closure-lambda.yml
    with:
      gha-environment: 'production'
      checkoutBranch: ${{ inputs.version }}
      environment: 'production'
    secrets:
      cicd-role: ${{ secrets.IAC_AWS_CI_ROLE_TO_ASSUME }}
