name: Save build cache
description: Cache node_modules and dist artifacts for downstream CI jobs.

inputs:
  cache-key:
    description: Full cache key to save build artifacts under
    required: true

runs:
  using: composite
  steps:
    - name: Cache build artifacts
      uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: |
          node_modules
          apps/frontend/node_modules
          apps/backend/node_modules
          packages/shared/node_modules
          packages/sdk/node_modules
          apps/frontend/dist
          apps/backend/dist
          packages/shared/dist
          packages/sdk/dist
          services/virus-scanner/build
          services/virus-scanner-guardduty/build
        key: ${{ inputs.cache-key }}
