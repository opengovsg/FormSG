name: Setup
description: Install Node, pnpm, cache turbo outputs, and install workspace dependencies.

inputs:
  job-index:
    description: Distinguishes matrix legs that write different .turbo contents
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22.22
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Cache turbo
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ inputs.job-index }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-${{ inputs.job-index }}-

    - name: Install dependencies
      shell: bash
      env:
        HUSKY: '0'
      run: pnpm install --frozen-lockfile --trust-lockfile
