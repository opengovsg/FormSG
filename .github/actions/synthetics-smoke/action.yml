name: Datadog synthetics smoke
description: >-
  Runs the FormSG CI smoke suite (Datadog synthetics tagged ci:formsg-smoke)
  against a deployed environment and fails if any test fails.
inputs:
  url:
    description: Base URL of the environment under test, without trailing slash
    required: true
  dd-api-key:
    description: Datadog API key
    required: true
  dd-app-key:
    description: Datadog application key with synthetics_read + synthetics_write
    required: true
runs:
  using: composite
  steps:
    - name: Install datadog-ci
      shell: bash
      run: |
        curl -L --fail "https://github.com/DataDog/datadog-ci/releases/download/v5.12.1/datadog-ci_linux-x64" --output /usr/local/bin/datadog-ci
        chmod +x /usr/local/bin/datadog-ci

    # The suite lives in Datadog, status "paused" so it never alerts on its own
    # schedule; CI triggers are the only runs. START_URL points every request at
    # the environment under test:
    #   nev-jju-pik  homepage serves (status, content-type, #root, latency)
    #   uar-ap6-m4w  backend API responds (GET /api/v3/client/env)
    #   rwb-ah7-7yh  landing page renders in a real browser
    - name: Run smoke suite
      shell: bash
      env:
        DATADOG_API_KEY: ${{ inputs.dd-api-key }}
        DATADOG_APP_KEY: ${{ inputs.dd-app-key }}
        DATADOG_SITE: datadoghq.com
        DATADOG_SUBDOMAIN: ogp
        URL: ${{ inputs.url }}
      run: |
        datadog-ci synthetics run-tests \
          --public-id nev-jju-pik \
          --public-id uar-ap6-m4w \
          --public-id rwb-ah7-7yh \
          --override startUrl="${URL}/" \
          --override variables.START_URL="${URL}" \
          --failOnTimeout \
          --failOnCriticalErrors \
          --failOnMissingTests
