name: Restore build cache
description: Restore node_modules and dist artifacts saved by save-build-cache.

inputs:
  cache-key:
    description: Full cache key used when saving build artifacts
    required: true
  fail-on-cache-miss:
    description: Fail the step when the cache key is not found
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Restore build artifacts
      uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: |
          node_modules
          apps/frontend/node_modules
          apps/backend/node_modules
          packages/shared/node_modules
          packages/sdk/node_modules
          apps/frontend/dist
          apps/backend/dist
          packages/shared/dist
          packages/sdk/dist
          services/virus-scanner/build
          services/virus-scanner-guardduty/build
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss == 'true' }}
