pull_request_rules:
  - name: Approve non-major dependabot dependency upgrades
    conditions:
      - author=dependabot[bot]
      - title~=bump [^\s]+ from ([\d]+)\..+ to \1\.
    actions:
      review:
        type: APPROVE
  - name: Approve non-major Snyk.io upgrades
    conditions:
      - author=snyk-bot
      - title~=\[Snyk\] Security upgrade [^\s]+ from ([\d]+)\..+ to \1\.
    actions:
      review:
        type: APPROVE
